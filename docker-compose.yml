services:

  backend:
    build:
      context: ./backend
    container_name: network-backend
    restart: unless-stopped
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    container_name: network-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
