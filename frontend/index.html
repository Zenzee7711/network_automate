<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Network Automation</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f3f4f6;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 700px;
            max-width: 95%;

            background: white;
            padding: 30px;

            border-radius: 12px;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        }

        h1 {
            text-align: center;
            color: #111827;
        }

        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 8px;

            font-weight: bold;
            color: #374151;
        }

        input,
        textarea {
            width: 100%;

            padding: 12px;

            border: 1px solid #d1d5db;
            border-radius: 6px;

            font-size: 15px;
        }

        textarea {
            min-height: 180px;
            resize: vertical;

            font-family: monospace;
        }

        button {
            width: 100%;

            margin-top: 20px;
            padding: 13px;

            border: none;
            border-radius: 6px;

            background: #2563eb;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        #status {
            margin-top: 20px;
            padding: 10px;

            border-radius: 6px;

            background: #f3f4f6;
            color: #374151;
        }

        pre {
            margin-top: 10px;
            padding: 15px;

            min-height: 200px;
            max-height: 500px;

            overflow: auto;

            background: #111827;
            color: #e5e7eb;

            border-radius: 6px;

            white-space: pre-wrap;

            font-family: monospace;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Network Automation</h1>

    <label for="routerIp">
        Router IP Address
    </label>

    <input
        id="routerIp"
        type="text"
        placeholder="192.168.138.10"
    >

    <label for="commands">
        Router Command Line
    </label>

    <textarea
        id="commands"
        placeholder="show ip interface brief
show version"
    ></textarea>

    <button
        id="executeButton"
        onclick="executeCommands()"
    >
        Execute
    </button>

    <div id="status">
        Ready
    </div>

    <pre id="output">No command executed yet.</pre>

</div>


<script>

async function executeCommands() {

    const routerIp =
        document.getElementById("routerIp").value.trim();

    const commands =
        document.getElementById("commands").value;

    const status =
        document.getElementById("status");

    const output =
        document.getElementById("output");

    const button =
        document.getElementById("executeButton");


    if (!routerIp) {
        status.textContent =
            "Please enter router IP address.";
        return;
    }


    if (!commands.trim()) {
        status.textContent =
            "Please enter a router command.";
        return;
    }


    button.disabled = true;

    status.textContent =
        "Connecting to router...";

    output.textContent =
        "Executing commands...";


    try {

        const response = await fetch(
            "/api/execute",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    router_ip: routerIp,
                    command: commands
                })
            }
        );


        const data = await response.json();


        if (data.success) {

            status.textContent =
                "Command executed successfully.";

            output.textContent =
                data.output;

        } else {

            status.textContent =
                "Command execution failed.";

            output.textContent =
                data.error || "Unknown error.";
        }


    } catch (error) {

        status.textContent =
            "Cannot connect to backend.";

        output.textContent =
            error.toString();

    } finally {

        button.disabled = false;
    }
}

</script>

</body>
</html>
